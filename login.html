<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录后台 - 三江源生态预警数字孪生平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="./js/config.js?v=0.3.0"></script>
    <script defer src="./js/api.js?v=0.3.0"></script>
    <script defer src="./js/login.js?v=0.3.0"></script>
    <style>
        :root { --bg: #010812; --green: #29f5cf; }
        body { background: radial-gradient(circle at 50% 20%, #06233a 0, var(--bg) 60%); color: #e2e8f0; font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; }
        .login-card { background: rgba(6, 18, 38, 0.92); border: 1px solid rgba(41, 245, 207, 0.25); box-shadow: 0 0 40px rgba(41, 245, 207, 0.08); }
        .login-field input { width: 100%; box-sizing: border-box; background: #041325; color: #e2e8f0; border: 1px solid rgba(41, 245, 207, 0.25); border-radius: 6px; padding: 10px 12px; font: inherit; font-size: 13px; }
        .login-field input:focus { outline: 1px solid var(--green); }
        .login-button { background: rgba(41, 245, 207, 0.12); border: 1px solid rgba(41, 245, 207, 0.55); color: #85f9dd; border-radius: 6px; padding: 9px 14px; width: 100%; font-size: 13px; }
        .login-button:hover:not(:disabled) { background: rgba(41, 245, 207, 0.2); }
        .login-button:disabled { opacity: 0.45; cursor: not-allowed; }
        #login-status { min-height: 18px; font-size: 11px; color: #94a3b8; overflow-wrap: anywhere; }
        #login-status[data-state="error"] { color: #fca5a5; }
        #login-status[data-state="loading"] { color: #86efac; }
        ::selection { background: rgba(41, 245, 207, 0.3); }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <main class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="inline-flex w-12 h-12 border-2 border-green-400 rounded-full items-center justify-center mb-3">
                <span class="text-green-300 text-lg">三</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">三江源生态预警数字孪生平台</h1>
            <p class="text-[9px] text-green-400/60 font-mono tracking-widest uppercase mt-1">Sanjiangyuan Ecological Digital Twin &amp; Early Warning</p>
        </div>
        <section class="login-card rounded-xl p-6" aria-labelledby="login-heading">
            <h2 id="login-heading" class="text-sm font-bold text-green-300 mb-1">后台登录</h2>
            <p class="text-[11px] text-slate-400 mb-5">使用服务器账号登录。查看者只读，编辑者维护监测点与预警，管理员可管理账号并查看审计。</p>
            <form id="login-form" class="space-y-4" novalidate>
                <div class="login-field flex flex-col gap-1.5">
                    <label for="login-username" class="text-[11px] text-slate-400">用户名</label>
                    <input id="login-username" name="username" type="text" autocomplete="username" required placeholder="admin">
                </div>
                <div class="login-field flex flex-col gap-1.5">
                    <label for="login-password" class="text-[11px] text-slate-400">密码</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
                </div>
                <button id="login-submit" type="submit" class="login-button">登录</button>
                <p id="login-status" role="status" aria-live="polite">请输入账号和密码登录。</p>
            </form>
        </section>
        <p class="text-center text-[10px] text-slate-500 mt-5">默认账号由部署者在首次启动时通过环境变量设置；请勿使用真实敏感凭据。</p>
        <p class="text-center text-[10px] text-slate-500 mt-1"><a class="underline hover:text-green-300" href="./main.html">返回生态概览</a></p>
    </main>
</body>
</html>
